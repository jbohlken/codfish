name: Release App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  build-windows:
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Collect Rust dependency licenses
        run: |
          cargo install cargo-about --features cli
          cd src-tauri && cargo about generate -c about.toml -o resources/THIRD_PARTY_LICENSES_RUST.txt about.hbs

      - name: Collect npm dependency licenses
        run: node scripts/collect-npm-licenses.js src-tauri/resources/THIRD_PARTY_LICENSES_NPM.txt

      - name: Build Tauri app (no release upload)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CODFISH_GH_PAT: ${{ secrets.CODFISH_GH_PAT }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows installer
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: https://cus.codesigning.azure.net
          trusted-signing-account-name: codfish
          certificate-profile-name: codfish-signing
          files-folder: src-tauri/target/release/bundle/nsis/
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Re-sign installer with Tauri minisign
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Azure Trusted Signing modifies the .exe in place to embed the
          # Authenticode signature, which invalidates the minisign .sig
          # produced during `tauri build`. Regenerate the .sig against the
          # post-codesigned binary so the in-app updater verifies on install.
          for f in src-tauri/target/release/bundle/nsis/*.exe; do
            [ -f "$f" ] || continue
            npx tauri signer sign "$f"
          done

      - name: Upload signed artifacts to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          # A semver prerelease tag (v0.7.0-beta.1) marks a beta: GitHub keeps
          # it out of "latest", so stable clients never see it.
          # Match our prerelease channels explicitly rather than any hyphen,
          # so an odd-but-valid stable tag can't be misread as a prerelease.
          # Lowercase the tag so this agrees with the case-insensitive GHA
          # `contains()` check the macOS build uses (a "-Beta" tag must not
          # classify differently between the two jobs).
          pre=""; [[ "${tag,,}" =~ -(beta|rc|alpha) ]] && pre="--prerelease"
          # Create draft release if it doesn't exist yet
          gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "${{ github.repository }}" --title "Codfish $tag" --draft $pre
          # Upload NSIS installer + updater sig
          for f in src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/nsis/*.sig; do
            [ -f "$f" ] && gh release upload "$tag" "$f" --repo "${{ github.repository }}" --clobber
          done

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Collect Rust dependency licenses
        run: |
          cargo install cargo-about --features cli
          cd src-tauri && cargo about generate -c about.toml -o resources/THIRD_PARTY_LICENSES_RUST.txt about.hbs

      - name: Collect npm dependency licenses
        run: node scripts/collect-npm-licenses.js src-tauri/resources/THIRD_PARTY_LICENSES_NPM.txt

      - name: Build and notarize Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CODFISH_GH_PAT: ${{ secrets.CODFISH_GH_PAT }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Codfish ${{ github.ref_name }}"
          releaseBody: ""
          releaseDraft: true
          # A semver prerelease tag (…-beta.N) → GitHub prerelease, kept out
          # of "latest" so only beta-channel clients receive it.
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
          # latest.json is assembled in the dedicated assemble-updater job
          # below, after both platform builds finish. tauri-action would
          # otherwise upload a partial manifest with only this runner's
          # platform, which the other job (or the assembler) would overwrite.

  assemble-updater:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform signature files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          mkdir sigs
          gh release download "$tag" \
            --repo "${{ github.repository }}" \
            --pattern "*.sig" \
            --dir sigs
          ls -la sigs/

      - name: Build latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          repo="${{ github.repository }}"
          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

          # Glob the .sig files rather than hardcoding names so a Tauri
          # filename change (or future per-platform variants) doesn't break
          # the manifest. Exactly one .exe.sig and one .app.tar.gz.sig are
          # expected; fail loudly otherwise.
          win_sig_path=$(ls sigs/*.exe.sig 2>/dev/null | head -1)
          mac_sig_path=$(ls sigs/*.app.tar.gz.sig 2>/dev/null | head -1)
          if [ -z "$win_sig_path" ] || [ -z "$mac_sig_path" ]; then
            echo "Missing platform signature(s) — expected one *.exe.sig and one *.app.tar.gz.sig in release assets."
            exit 1
          fi

          win_asset=$(basename "$win_sig_path" .sig)
          mac_asset=$(basename "$mac_sig_path" .sig)
          win_sig=$(cat "$win_sig_path")
          mac_sig=$(cat "$mac_sig_path")
          base_url="https://github.com/${repo}/releases/download/${tag}"

          # Per-platform minimum OS floor for THIS release, read by the update
          # gate in clients >= 0.6.10 (older/fieldless clients ignore it).
          # 0.7.0 requires macOS 13.4 (Ventura): tauri.conf minimum_system_version
          # / whisper.cpp toolchain floor. No Windows floor beyond the app's
          # baseline (Win 10 1803).
          min_os='{"darwin":"13.4"}'

          jq -n \
            --arg version "$version" \
            --arg pub_date "$pub_date" \
            --arg win_sig "$win_sig" \
            --arg win_url "${base_url}/${win_asset}" \
            --arg mac_sig "$mac_sig" \
            --arg mac_url "${base_url}/${mac_asset}" \
            --argjson min_os "$min_os" \
            '{
              version: $version,
              notes: "",
              pub_date: $pub_date,
              minimumSystemVersion: $min_os,
              platforms: {
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "darwin-aarch64-app": { signature: $mac_sig, url: $mac_url },
                "windows-x86_64": { signature: $win_sig, url: $win_url }
              }
            }' > latest.json
          cat latest.json

      - name: Upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Always attach latest.json to this release (stable and prerelease
          # alike). For a stable release it becomes live via GitHub's "latest"
          # pointer the moment the draft is published — manifest and assets go
          # live together, no gap. For a prerelease it just rides along; the
          # beta channel is routed to it AFTER publish (see promote-beta.yml),
          # so beta.json never points at not-yet-downloadable draft assets.
          gh release upload "${{ github.ref_name }}" latest.json \
            --repo "${{ github.repository }}" --clobber
